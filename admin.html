<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student roster | Campus Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-page">
  <header class="topbar">
    <a class="brand" href="admin.html"><span class="brand-mark">C</span> Campus Portal</a>
    <div class="topbar-right">
      <span class="user-chip">Administrator · <strong id="admin-username"></strong></span>
      <button class="button button-secondary" type="button" data-sign-out>Sign out</button>
    </div>
  </header>
  <main class="dashboard">
    <div class="page-heading">
      <div>
        <h1>Admin dashboard</h1>
        <p>View and manage registered student accounts.</p>
      </div>
    </div>
    <section class="stat-card" aria-label="Registered student count">
      <span>Registered students</span>
      <strong id="student-count">0</strong>
    </section>
    <section class="panel">
      <h2>Student details</h2>
      <p class="inline-error" id="roster-error" role="alert" hidden></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Name</th><th>Student ID</th><th>Year</th><th>Course</th><th>Username</th><th>Action</th></tr>
          </thead>
          <tbody id="student-roster"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
